<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; }
      .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; }
    </style>
  </defs>
  <rect width="1600" height="1000" fill="#FFFFFF"/>

  <!-- Top Legend -->
  <rect x="60" y="20" width="240" height="36" rx="4" fill="#2563EB"/>
  <text x="180" y="43" fill="#FFFFFF" font-size="13" text-anchor="middle" class="title">Application landing zone subscription</text>
  <rect x="320" y="20" width="260" height="36" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <line x1="335" y1="32" x2="375" y2="32" stroke="#1E293B" stroke-width="2"/>
  <text x="385" y="36" fill="#334155" font-size="11" class="label">Provisioned ingress</text>
  <line x1="335" y1="46" x2="375" y2="46" stroke="#EA580C" stroke-width="2"/>
  <text x="385" y="50" fill="#334155" font-size="11" class="label">Controlled egress</text>

  <!-- Users Ingress -->
  <circle cx="35" cy="180" r="18" fill="#0284C7"/>
  <text x="35" y="212" fill="#0F172A" font-size="12" text-anchor="middle" class="title">Users</text>

  <!-- Main Blue Subscription Box -->
  <rect x="65" y="68" width="1505" height="640" rx="6" fill="#DBEAFE" stroke="#3B82F6" stroke-width="3"/>
  <text x="85" y="92" fill="#1E3A8A" font-size="15" class="title">Application landing zone subscription</text>

  <!-- Workload Resources White Box -->
  <rect x="85" y="105" width="1465" height="480" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <text x="105" y="128" fill="#0F172A" font-size="14" class="title">Workload resources (Spoke Virtual Network)</text>

  <!-- Left Column Subnets -->
  <rect x="105" y="142" width="220" height="95" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="215" y="160" fill="#334155" font-size="12" text-anchor="middle" class="title">Application Gateway Subnet</text>
  <rect x="130" y="170" width="170" height="52" rx="4" fill="#DCFCE7" stroke="#22C55E"/>
  <text x="215" y="194" fill="#166534" font-size="11" text-anchor="middle" class="title">Application Gateway + WAF</text>
  <text x="215" y="210" fill="#15803D" font-size="10" text-anchor="middle" class="sub">Zone Redundant Ingress</text>

  <rect x="105" y="250" width="220" height="75" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="215" y="268" fill="#334155" font-size="12" text-anchor="middle" class="title">Jumpbox &amp; Build Subnets</text>
  <text x="215" y="292" fill="#475569" font-size="11" text-anchor="middle" class="label">Jumpbox VM · Build Agents</text>

  <rect x="105" y="340" width="220" height="110" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="215" y="360" fill="#334155" font-size="12" text-anchor="middle" class="title">Observability &amp; Security</text>
  <text x="215" y="385" fill="#475569" font-size="11" text-anchor="middle" class="label">Azure Monitor · Log Analytics</text>
  <text x="215" y="405" fill="#475569" font-size="11" text-anchor="middle" class="label">Application Insights</text>
  <text x="215" y="425" fill="#475569" font-size="11" text-anchor="middle" class="label">Defender for Cloud</text>

  <!-- Center Top: Agent Subnet -->
  <rect x="355" y="142" width="460" height="145" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="375" y="162" fill="#334155" font-size="12" class="title">Agent Subnet (Azure Container Apps Environment)</text>
  <rect x="375" y="176" width="130" height="44" rx="4" fill="#F3E8FF" stroke="#A855F7"/>
  <text x="440" y="202" fill="#6B21A8" font-size="11" text-anchor="middle" class="title">Agent 1 (Orchestrator)</text>
  <rect x="520" y="176" width="130" height="44" rx="4" fill="#F3E8FF" stroke="#A855F7"/>
  <text x="585" y="202" fill="#6B21A8" font-size="11" text-anchor="middle" class="title">Agent 2 (Data Analyst)</text>
  <rect x="665" y="176" width="130" height="44" rx="4" fill="#F3E8FF" stroke="#A855F7"/>
  <text x="730" y="202" fill="#6B21A8" font-size="11" text-anchor="middle" class="title">Agent 3 (Compliance)</text>
  <rect x="440" y="232" width="290" height="40" rx="4" fill="#E0E7FF" stroke="#6366F1"/>
  <text x="585" y="256" fill="#3730A3" font-size="11" text-anchor="middle" class="title">Agent Orchestration API &amp; Semantic Kernel</text>

  <!-- API Management & Private Endpoints Strip -->
  <rect x="355" y="302" width="180" height="80" rx="4" fill="#F0F9FF" stroke="#0EA5E9"/>
  <text x="445" y="325" fill="#0369A1" font-size="12" text-anchor="middle" class="title">API Management Subnet</text>
  <text x="445" y="348" fill="#0284C7" font-size="11" text-anchor="middle" class="label">Azure API Management</text>
  <text x="445" y="366" fill="#0369A1" font-size="10" text-anchor="middle" class="sub">Internal VNet Gateway</text>

  <rect x="555" y="302" width="620" height="80" rx="4" fill="#F8FAFC" stroke="#94A3B8" stroke-dasharray="4 2"/>
  <text x="575" y="322" fill="#334155" font-size="12" class="title">Private Endpoints Subnet (Azure Private Link)</text>
  <text x="865" y="352" fill="#0284C7" font-size="11" text-anchor="middle" class="label">Cosmos PE · Storage PE · Key Vault PE · AI Search PE · OpenAI PE · ACR PE</text>

  <!-- App Service Subnet -->
  <rect x="355" y="400" width="820" height="165" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="375" y="422" fill="#334155" font-size="12" class="title">App Service Environment v3 &amp; Integration Subnets</text>
  <rect x="380" y="440" width="240" height="105" rx="4" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="500" y="468" fill="#1D4ED8" font-size="12" text-anchor="middle" class="title">App Service Plan (Zone 1)</text>
  <text x="500" y="492" fill="#2563EB" font-size="11" text-anchor="middle" class="sub">Web App Frontend UI</text>
  <rect x="645" y="440" width="240" height="105" rx="4" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="765" y="468" fill="#1D4ED8" font-size="12" text-anchor="middle" class="title">App Service Plan (Zone 2)</text>
  <text x="765" y="492" fill="#2563EB" font-size="11" text-anchor="middle" class="sub">API Backend Service</text>
  <rect x="910" y="440" width="240" height="105" rx="4" fill="#EFF6FF" stroke="#3B82F6"/>
  <text x="1030" y="468" fill="#1D4ED8" font-size="12" text-anchor="middle" class="title">App Service Plan (Zone 3)</text>
  <text x="1030" y="492" fill="#2563EB" font-size="11" text-anchor="middle" class="sub">Worker &amp; Webhook Processor</text>

  <!-- Right Column: AI Foundry & Data Services -->
  <rect x="1195" y="142" width="335" height="240" rx="4" fill="#F0FDF4" stroke="#22C55E"/>
  <text x="1215" y="162" fill="#166534" font-size="12" class="title">Azure AI Foundry Hub (Managed VNet)</text>
  <rect x="1215" y="176" width="295" height="44" rx="4" fill="#FFFFFF" stroke="#86EFAC"/>
  <text x="1362" y="203" fill="#15803D" font-size="12" text-anchor="middle" class="title">Azure OpenAI Service (GPT-4o / Embeddings)</text>
  <rect x="1215" y="232" width="295" height="44" rx="4" fill="#FFFFFF" stroke="#86EFAC"/>
  <text x="1362" y="259" fill="#15803D" font-size="12" text-anchor="middle" class="title">Azure AI Search (Vector &amp; Hybrid Index)</text>
  <rect x="1215" y="288" width="295" height="44" rx="4" fill="#FFFFFF" stroke="#86EFAC"/>
  <text x="1362" y="315" fill="#15803D" font-size="12" text-anchor="middle" class="title">Managed Online Endpoints &amp; AI Services</text>

  <rect x="1195" y="400" width="335" height="165" rx="4" fill="#F8FAFC" stroke="#CBD5E1"/>
  <text x="1215" y="422" fill="#334155" font-size="12" class="title">Enterprise Data &amp; Secrets Tier</text>
  <text x="1362" y="455" fill="#0F172A" font-size="12" text-anchor="middle" class="label">Azure Cosmos DB (NoSQL State Store)</text>
  <text x="1362" y="485" fill="#0F172A" font-size="12" text-anchor="middle" class="label">Azure Key Vault (HSM Secrets &amp; Keys)</text>
  <text x="1362" y="515" fill="#0F172A" font-size="12" text-anchor="middle" class="label">Azure Container Registry &amp; Storage</text>

  <!-- Subscription Vending Provisioned Resources Strip -->
  <rect x="85" y="600" width="1465" height="90" rx="6" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <text x="105" y="622" fill="#1E3A8A" font-size="13" class="title">Subscription vending provisioned resources</text>
  <text x="815" y="658" fill="#334155" font-size="12" text-anchor="middle" class="label">Management Group Hierarchy · Spoke VNet Peering · Managed Identities &amp; RBAC · Cost Management Budgets · Azure Policy Guardrails</text>

  <!-- Bottom Gold Box: Platform Landing Zone Subscription -->
  <rect x="65" y="725" width="760" height="245" rx="6" fill="#FEF08A" stroke="#EAB308" stroke-width="3"/>
  <text x="85" y="750" fill="#854D0E" font-size="15" class="title">Platform landing zone subscription (Connectivity Hub)</text>

  <rect x="85" y="765" width="350" height="185" rx="4" fill="#FFFFFF" stroke="#FDE047"/>
  <text x="260" y="788" fill="#713F12" font-size="13" text-anchor="middle" class="title">Hub Virtual Network (Region 1)</text>
  <text x="260" y="825" fill="#DC2626" font-size="12" text-anchor="middle" class="title">Azure Firewall (Central Egress &amp; IDPS)</text>
  <text x="260" y="860" fill="#0284C7" font-size="12" text-anchor="middle" class="label">Azure Bastion Host</text>
  <text x="260" y="895" fill="#475569" font-size="12" text-anchor="middle" class="label">VPN Gateway / ExpressRoute Gateway</text>

  <rect x="455" y="765" width="350" height="185" rx="4" fill="#FFFFFF" stroke="#FDE047"/>
  <text x="630" y="788" fill="#713F12" font-size="13" text-anchor="middle" class="title">Private DNS &amp; Hybrid Connectivity</text>
  <text x="630" y="825" fill="#0369A1" font-size="12" text-anchor="middle" class="title">Private DNS Zones (for Private Link)</text>
  <text x="630" y="860" fill="#0369A1" font-size="12" text-anchor="middle" class="label">Azure DNS Private Resolver</text>
  <text x="630" y="895" fill="#15803D" font-size="12" text-anchor="middle" class="label">Azure DDoS Protection Standard</text>
</svg>
