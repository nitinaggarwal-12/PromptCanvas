<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#0F2952"/>
      <stop offset="60%" stop-color="#071226"/>
      <stop offset="100%" stop-color="#030812"/>
    </radialGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#153264" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#091732" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E4080" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0B1D3A" stop-opacity="0.98"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .hdr-cyan { font-family: "Inter", "Segoe UI", sans-serif; font-weight: 800; fill: #38BDF8; letter-spacing: 2px; }
      .hdr-white { font-family: "Inter", "Segoe UI", sans-serif; font-weight: 300; fill: #F8FAFC; letter-spacing: 2px; }
      .card-title { font-family: "Inter", "Segoe UI", sans-serif; font-weight: 700; fill: #FFFFFF; font-size: 18px; }
      .card-sub { font-family: "Inter", "Segoe UI", sans-serif; font-weight: 600; fill: #E2E8F0; font-size: 14px; }
      .card-muted { font-family: "Inter", "Segoe UI", sans-serif; font-weight: 500; fill: #94A3B8; font-size: 13px; }
    </style>
  </defs>

  <!-- Deep Space Cyber Gradient Background -->
  <rect width="1600" height="960" fill="url(#bgGlow)"/>

  <!-- Header Section -->
  <line x1="250" y1="75" x2="1350" y2="75" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.6"/>
  <text x="800" y="60" text-anchor="middle" font-size="32">
    <tspan class="hdr-cyan">AGENTIC AI</tspan>
    <tspan class="hdr-white"> ARCHITECTURE</tspan>
  </text>

  <!-- Layer 1: Input / Perception Layer -->
  <rect x="360" y="105" width="880" height="135" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="2" filter="url(#cyanGlow)"/>
  <text x="800" y="135" text-anchor="middle" class="card-title">Input / Perception Layer</text>

  <!-- Input Icons -->
  <g transform="translate(560, 150)">
    <ellipse cx="24" cy="10" rx="18" ry="7" fill="none" stroke="#38BDF8" stroke-width="2.2"/>
    <path d="M6 10v16c0 4 8 7 18 7s18-3 18-7V10" fill="none" stroke="#38BDF8" stroke-width="2.2"/>
    <circle cx="38" cy="24" r="10" fill="#0284C7" stroke="#7DD3FC" stroke-width="1.5"/>
  </g>
  <line x1="620" y1="170" x2="750" y2="170" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 4"/>

  <g transform="translate(775, 148)">
    <circle cx="24" cy="22" r="16" fill="#0284C7" stroke="#7DD3FC" stroke-width="2"/>
    <text x="24" y="26" text-anchor="middle" fill="#FFFFFF" font-size="11" font-weight="800" font-family="sans-serif">API</text>
  </g>
  <line x1="835" y1="170" x2="965" y2="170" stroke="#38BDF8" stroke-width="2" stroke-dasharray="6 4"/>

  <g transform="translate(985, 148)">
    <rect x="4" y="6" width="28" height="20" rx="4" fill="#0284C7" stroke="#7DD3FC" stroke-width="2"/>
    <rect x="18" y="16" width="24" height="18" rx="4" fill="#0F2952" stroke="#38BDF8" stroke-width="2"/>
  </g>

  <text x="800" y="220" text-anchor="middle" class="card-sub">Data Sources · APIs · User Prompts</text>

  <!-- Arrow Down to Reasoning Core -->
  <line x1="800" y1="240" x2="800" y2="290" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="800,298 794,286 806,286" fill="#38BDF8"/>

  <!-- Layer 2: Middle 3 Cards (Memory, Reasoning Core, Planning Module) -->
  <!-- Memory Card -->
  <rect x="250" y="300" width="310" height="210" rx="16" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="2"/>
  <text x="405" y="335" text-anchor="middle" class="card-title">Memory</text>
  <g transform="translate(355, 360)">
    <circle cx="24" cy="24" r="20" fill="none" stroke="#38BDF8" stroke-width="2.2"/>
    <polyline points="24,12 24,24 32,28" fill="none" stroke="#7DD3FC" stroke-width="2.2"/>
    <ellipse cx="76" cy="14" rx="16" ry="6" fill="none" stroke="#38BDF8" stroke-width="2.2"/>
    <path d="M60 14v20c0 3.5 7 6 16 6s16-2.5 16-6V14" fill="none" stroke="#38BDF8" stroke-width="2.2"/>
  </g>
  <text x="405" y="455" text-anchor="middle" class="card-sub">Short-Term &amp; Long-Term</text>
  <text x="405" y="478" text-anchor="middle" class="card-muted">Vector Database</text>

  <!-- Bidirectional Arrow Memory <-> Reasoning -->
  <line x1="565" y1="405" x2="625" y2="405" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="560,405 572,399 572,411" fill="#38BDF8"/>
  <polygon points="630,405 618,399 618,411" fill="#38BDF8"/>

  <!-- Reasoning Core Hero Card -->
  <rect x="635" y="300" width="330" height="210" rx="16" fill="url(#heroGrad)" stroke="#7DD3FC" stroke-width="2.5" filter="url(#cyanGlow)"/>
  <text x="800" y="335" text-anchor="middle" class="card-title">Reasoning Core</text>
  <!-- Brain SVG -->
  <g transform="translate(768, 352)">
    <path d="M32 8 C18 8 10 18 10 30 C10 42 18 52 30 52 L30 8 Z" fill="#0284C7" fill-opacity="0.35" stroke="#38BDF8" stroke-width="2.2"/>
    <path d="M34 8 C48 8 56 18 56 30 C56 42 48 52 36 52 L36 8 Z" fill="#0284C7" fill-opacity="0.35" stroke="#38BDF8" stroke-width="2.2"/>
    <circle cx="22" cy="22" r="3" fill="#7DD3FC"/>
    <circle cx="44" cy="22" r="3" fill="#7DD3FC"/>
    <circle cx="20" cy="36" r="3" fill="#7DD3FC"/>
    <circle cx="46" cy="36" r="3" fill="#7DD3FC"/>
    <line x1="22" y1="22" x2="30" y2="30" stroke="#7DD3FC" stroke-width="1.5"/>
    <line x1="44" y1="22" x2="36" y2="30" stroke="#7DD3FC" stroke-width="1.5"/>
  </g>
  <text x="800" y="468" text-anchor="middle" class="card-title">LLM Brain</text>

  <!-- Bidirectional Arrow Reasoning <-> Planning -->
  <line x1="970" y1="405" x2="1030" y2="405" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="965,405 977,399 977,411" fill="#38BDF8"/>
  <polygon points="1035,405 1023,399 1023,411" fill="#38BDF8"/>

  <!-- Planning Module Card -->
  <rect x="1040" y="300" width="310" height="210" rx="16" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="2"/>
  <text x="1195" y="335" text-anchor="middle" class="card-title">Planning Module</text>
  <g transform="translate(1160, 358)">
    <rect x="6" y="6" width="36" height="42" rx="5" fill="#0284C7" fill-opacity="0.3" stroke="#38BDF8" stroke-width="2.2"/>
    <polyline points="14,20 20,26 32,14" fill="none" stroke="#7DD3FC" stroke-width="2.5"/>
    <line x1="42" y1="27" x2="60" y2="27" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="66" cy="15" r="5" fill="#38BDF8"/>
    <circle cx="66" cy="27" r="5" fill="#38BDF8"/>
    <circle cx="66" cy="39" r="5" fill="#38BDF8"/>
  </g>
  <text x="1195" y="468" text-anchor="middle" class="card-sub">Task Decomposition</text>

  <!-- Orthogonal Arrows from Memory, Reasoning, Planning into External APIs Bar -->
  <polyline points="405,510 405,605 510,605" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="518,605 506,599 506,611" fill="#38BDF8"/>

  <line x1="800" y1="510" x2="800" y2="552" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="800,560 794,548 806,548" fill="#38BDF8"/>

  <polyline points="1195,510 1195,605 1090,605" fill="none" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="1082,605 1094,599 1094,611" fill="#38BDF8"/>

  <!-- Layer 3: External APIs & Code Execution -->
  <rect x="520" y="562" width="560" height="100" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="2"/>
  <g transform="translate(670, 578)">
    <ellipse cx="18" cy="8" rx="14" ry="5" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <path d="M4 8v12c0 3 6 5 14 5s14-2 14-5V8" fill="none" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="130" cy="14" r="14" fill="#0284C7" stroke="#7DD3FC" stroke-width="2"/>
    <text x="130" y="18" text-anchor="middle" fill="#FFFFFF" font-size="10" font-weight="800">API</text>
    <circle cx="240" cy="14" r="12" fill="none" stroke="#38BDF8" stroke-width="2.2" stroke-dasharray="4 2"/>
  </g>
  <text x="800" y="642" text-anchor="middle" class="card-sub">External APIs · Code Execution</text>

  <!-- Arrow Down to Action / Execution Layer -->
  <line x1="800" y1="662" x2="800" y2="702" stroke="#38BDF8" stroke-width="2.5"/>
  <polygon points="800,710 794,698 806,698" fill="#38BDF8"/>

  <!-- Layer 4: Action / Execution Layer (Glowing Platform) -->
  <polygon points="520,715 1080,715 1130,815 470,815" fill="url(#heroGrad)" stroke="#38BDF8" stroke-width="2.5" filter="url(#cyanGlow)"/>
  <text x="800" y="745" text-anchor="middle" class="card-title">Action / Execution Layer</text>
  <!-- Rocket Icon -->
  <g transform="translate(782, 756)">
    <path d="M18 2 C26 10 28 22 28 32 L8 32 C8 22 10 10 18 2 Z" fill="#38BDF8"/>
    <polygon points="8,26 2,36 8,34" fill="#0284C7"/>
    <polygon points="28,26 34,36 28,34" fill="#0284C7"/>
    <circle cx="18" cy="18" r="4" fill="#071226"/>
  </g>

  <!-- Symmetrical Curved Feedback / Reflection Loop Arc -->
  <path d="M 1090 830 C 1090 895, 510 895, 510 830" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="8 4"/>
  <polygon points="510,822 503,835 517,835" fill="#38BDF8"/>
  <polygon points="1090,822 1083,835 1097,835" fill="#38BDF8"/>
  <rect x="670" y="862" width="260" height="32" rx="16" fill="#071226" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="800" y="883" text-anchor="middle" class="card-sub" fill="#7DD3FC">Feedback / Reflection Loop</text>

  <!-- Brand Signature -->
  <text x="1480" y="910" text-anchor="end" fill="#FFFFFF" font-family="Georgia, serif" font-size="28" font-weight="700" font-style="italic">bismart</text>
</svg>
