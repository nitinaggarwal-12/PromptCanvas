name: verify
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit, golden pipeline, and anti-theatre ratchet tests
        run: npm run test -- --run
      - name: Guard test integrity
        run: |
          if git diff HEAD^1..HEAD -- '**/*.test.ts' '**/fixtures/**' src/lib/technicalArchitectureXmls.ts | grep -E '^\+.*\.(skip|only)\(' ; then
            echo "::error::Skipped/focused tests introduced in this change"; exit 1; fi
      - name: Nav badge, retired route, and full-repo source purity gate
        run: node scripts/verify_nav_badge_counts.mjs
      - name: Canonical blueprint certification gate
        run: npm run test:canonical
      - name: Production Next.js build & validation suite
        run: npm run build
