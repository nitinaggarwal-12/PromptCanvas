  <rect x="25" y="755" width="505" height="215" rx="14" class="box"/><text x="48" y="787" class="h">KEY FLOWS</text><text x="48" y="817" class="t">1. Users authenticate and access governed NovaCura experiences.</text><text x="48" y="847" class="t">2. Regulatory and enterprise content is ingested, classified and indexed.</text><text x="48" y="877" class="t">3. AI agents retrieve grounded evidence and execute approved tools.</text><text x="48" y="907" class="t">4. Human reviewers approve high-risk outputs and submission content.</text><text x="48" y="937" class="t">5. Decisions, citations, evaluations and audit evidence are retained.</text>
  <rect x="550" y="755" width="480" height="215" rx="14" class="green"/><text x="574" y="787" class="h">SECURITY &amp; COMPLIANCE</text><text x="574" y="817" class="t">• SSO / MFA • Least privilege IAM • Workload identity</text><text x="574" y="847" class="t">• TLS in transit • CMEK/KMS at rest • Secrets management</text><text x="574" y="877" class="t">• Data classification • DLP • regional controls • audit logging</text><text x="574" y="907" class="t">• GxP / 21 CFR Part 11-ready controls where applicable</text><text x="574" y="937" class="t">• AI safety, grounding, evaluation, HITL and traceability</text>
