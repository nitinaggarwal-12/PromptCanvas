  <rect width="1600" height="1000" fill="#ffffff"/>
  <rect x="24" y="22" width="82" height="68" rx="12" fill="#0b57d0"/><text x="65" y="67" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#fff">01</text>
  <text x="126" y="53" class="title">System Context Diagram</text><text x="126" y="82" class="sub">NovaCura — AI-Powered Regulatory Intelligence Platform</text>
  <text x="610" y="49" class="sub">Shows NovaCura in its environment: external actors, enterprise systems, major information flows, boundaries and outcomes.</text>

