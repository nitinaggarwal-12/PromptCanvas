  <rect x="360" y="122" width="820" height="600" rx="18" class="panel"/><text x="770" y="163" text-anchor="middle" font-family="Arial" font-size="27" font-weight="700" fill="#0b57d0">NovaCura Regulatory Intelligence Platform</text><text x="770" y="190" text-anchor="middle" class="sub">Enterprise AI platform for regulatory knowledge, evidence, agent-assisted analysis and governed decision support</text>
  <rect x="390" y="220" width="230" height="125" rx="14" class="soft"/><text x="505" y="252" text-anchor="middle" class="h">Regulatory Intelligence</text><text x="415" y="280" class="t">• Global guidance monitoring</text><text x="415" y="304" class="t">• Requirement extraction</text><text x="415" y="328" class="t">• Change impact analysis</text>
  <rect x="645" y="220" width="230" height="125" rx="14" class="soft"/><text x="760" y="252" text-anchor="middle" class="h">Submission Workspace</text><text x="670" y="280" class="t">• eCTD content assistance</text><text x="670" y="304" class="t">• Evidence traceability</text><text x="670" y="328" class="t">• Review workflow</text>
  <rect x="900" y="220" width="230" height="125" rx="14" class="soft"/><text x="1015" y="252" text-anchor="middle" class="h">AI / Agent Services</text><text x="925" y="280" class="t">• Research &amp; analysis agents</text><text x="925" y="304" class="t">• RAG / grounded generation</text><text x="925" y="328" class="t">• Tool &amp; protocol access</text>
  <rect x="390" y="375" width="230" height="125" rx="14" class="green"/><text x="505" y="407" text-anchor="middle" class="h">Knowledge Platform</text><text x="415" y="435" class="t">• Regulatory corpus</text><text x="415" y="459" class="t">• Clinical / safety evidence</text><text x="415" y="483" class="t">• Metadata, lineage, citations</text>
  <rect x="645" y="375" width="230" height="125" rx="14" class="green"/><text x="760" y="407" text-anchor="middle" class="h">Analytics &amp; Decisions</text><text x="670" y="435" class="t">• Risk scoring &amp; trends</text><text x="670" y="459" class="t">• Gap / readiness analysis</text><text x="670" y="483" class="t">• Executive insights</text>
  <rect x="900" y="375" width="230" height="125" rx="14" class="purple"/><text x="1015" y="407" text-anchor="middle" class="h">Governance &amp; Trust</text><text x="925" y="435" class="t">• HITL / approvals</text><text x="925" y="459" class="t">• Policy &amp; guardrails</text><text x="925" y="483" class="t">• Audit / evaluation</text>
  <rect x="390" y="535" width="740" height="70" rx="12" class="box"/><text x="760" y="565" text-anchor="middle" class="h">Integration &amp; API Layer</text><text x="760" y="589" text-anchor="middle" class="t">REST / GraphQL / Events • MCP • A2A • Enterprise connectors • API gateway • Orchestration</text>
